name: Publish Unified HR Analytics Project

on:
  push:
    paths:
      - ".github/workflows/publish-unified-project.yml"
      - "scripts/build_unified_archive.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build one clean unified archive
        run: python scripts/build_unified_archive.py

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit updated unified ZIP
        run: |
          git add bd-hr-analytics-unified-project.zip
          if git diff --cached --quiet; then
            echo "Unified ZIP is already current."
          else
            git commit -m "release: refresh unified project ZIP"
            git push origin HEAD:main
          fi
