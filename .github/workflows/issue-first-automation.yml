name: Issue First Automation

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CodeQL
      - Security Gates
      - Required Branch Checks
      - Participant Submission Governance
    types: [completed]
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  issue-first:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            for (const [name,color,description] of [['bot:proposal','5319e7','Bot proposal'],['bot:ci-failure','b60205','Automated CI failure'],['status:triage','fbca04','Awaiting triage'],['issue-first','0e8a16','Issue-first tracking'],['auto-resolved','0e8a16','Verified automatically']]) {
              try { await github.rest.issues.getLabel({owner,repo,name}); }
              catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({owner,repo,name,color,description});
              }
            }
            if (context.eventName === 'workflow_dispatch') return;
            if (context.eventName === 'pull_request_target') {
              const pr = context.payload.pull_request;
              const isBot = context.payload.sender?.type === 'Bot' && context.actor.endsWith('[bot]');
              if (!isBot || (pr.labels || []).some(l => l.name === 'allow-bot-pr')) return;
              const marker = `<!-- bot-pr:${pr.number} -->`;
              const {data:list} = await github.rest.issues.listForRepo({owner,repo,state:'open',labels:'bot:proposal',per_page:100});
              let issue = list.find(i => !i.pull_request && (i.body || '').includes(marker));
              if (!issue) issue = (await github.rest.issues.create({owner,repo,title:`[Bot Proposal] ${String(pr.title || 'Untitled').slice(0,180)}`,labels:['bot:proposal','status:triage','issue-first'],body:`${marker}\nBot PR #${pr.number} was converted to an issue.\n\nOriginal PR: ${pr.html_url}\nCommit: \`${pr.head.sha}\`\n\n- [ ] Validate the problem\n- [ ] Define acceptance criteria\n- [ ] Add \`approved-for-fix\`\n- [ ] Implement after approval`})).data;
              await github.rest.issues.createComment({owner,repo,issue_number:pr.number,body:`Converted to issue #${issue.number} under the Issue First policy.`});
              await github.rest.pulls.update({owner,repo,pull_number:pr.number,state:'closed'});
              return;
            }
            const run = context.payload.workflow_run;
            if (!run || run.name === 'Issue First Automation') return;
            const marker = `<!-- workflow-key:${run.workflow_id || run.name}:${run.head_branch || run.head_sha || 'unknown'} -->`;
            const {data:list} = await github.rest.issues.listForRepo({owner,repo,state:'open',labels:'bot:ci-failure',per_page:100});
            const issue = list.find(i => !i.pull_request && (i.body || '').includes(marker));
            if (run.conclusion === 'success') {
              if (issue) {
                await github.rest.issues.createComment({owner,repo,issue_number:issue.number,body:`✅ Verified by successful run: ${run.html_url}`});
                await github.rest.issues.update({owner,repo,issue_number:issue.number,state:'closed',state_reason:'completed',labels:[...new Set([...(issue.labels || []).map(l => typeof l === 'string' ? l : l.name),'auto-resolved'])]});
              }
              return;
            }
            if (!['failure','timed_out','action_required','startup_failure'].includes(run.conclusion)) return;
            const body = `${marker}\nWorkflow **${run.name}** failed on \`${run.head_branch || 'unknown'}\`.\n\nRun: ${run.html_url}\nCommit: \`${run.head_sha}\`\n\n- [ ] Find root cause\n- [ ] Record proposed fix and risk\n- [ ] Apply smallest safe change\n- [ ] Verify by rerun`;
            if (issue) await github.rest.issues.createComment({owner,repo,issue_number:issue.number,body:`Failure occurred again.\n\n${body}`});
            else await github.rest.issues.create({owner,repo,title:`[CI Failure] ${run.name} on ${run.head_branch || 'unknown'}`.slice(0,240),labels:['bot:ci-failure','status:triage','issue-first'],body});
