name: Required Branch Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: required-branch-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-project:
    name: validate-project
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Enforce participant submission boundary
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          if [[ "${HEAD_REF}" == submission/* ]]; then
            echo "::error::Participant submission branches must target participant-review, not main."
            exit 1
          fi

          mapfile -t changed_files < <(
            gh api --paginate \
              "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
              --jq '.[].filename'
          )

          for file in "${changed_files[@]}"; do
            if [[ "${file}" == participant-submissions/solutions/*/*/* ]]; then
              echo "::error::Participant solution files must be reviewed through participant-review before any maintainer promotion to main."
              exit 1
            fi
          done

          echo "Participant submission boundary passed."

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Validate repository structure and passive data files
        run: python scripts/security/validate_repository.py

  security-checks:
    name: security-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
